plugins {
  // Fray controlled-concurrency testing, https://github.com/cmu-pasta/fray — loaded on the classpath here
  // and applied conditionally below (the plugin requires a JDK 11+ Gradle JVM; JDK 8 jobs must not load it).
  id "org.pastalab.fray.gradle" version "0.9.2" apply false
}

apply plugin: "io.servicetalk.servicetalk-gradle-plugin-internal-library"

dependencies {
  api project(":servicetalk-concurrent")
  api project(":servicetalk-context-api")

  implementation project(":servicetalk-annotations")
  implementation project(":servicetalk-concurrent-internal")
  implementation project(":servicetalk-utils-internal")
  implementation "org.slf4j:slf4j-api:$slf4jVersion"

  testImplementation enforcedPlatform("org.junit:junit-bom:$junit5Version")
  testImplementation testFixtures(project(":servicetalk-concurrent-internal"))
  testImplementation project(":servicetalk-concurrent-test-internal")
  testImplementation project(":servicetalk-test-resources")
  testImplementation "org.junit.jupiter:junit-jupiter-api"
  testImplementation "org.junit.jupiter:junit-jupiter-params"
  testImplementation "org.hamcrest:hamcrest:$hamcrestVersion"
  testImplementation "org.mockito:mockito-core:$mockitoCoreVersion"

  testFixturesApi platform("org.junit:junit-bom:$junit5Version")
  testFixturesApi project(":servicetalk-concurrent")
  testFixturesApi project(":servicetalk-concurrent-internal")
  testFixturesApi "org.junit.jupiter:junit-jupiter-api"
  testFixturesApi "org.hamcrest:hamcrest:$hamcrestVersion"

  testFixturesImplementation project(":servicetalk-utils-internal")
  testFixturesImplementation project(":servicetalk-concurrent-test-internal")
  testFixturesImplementation "com.google.code.findbugs:jsr305:$jsr305Version"
  testFixturesImplementation "org.slf4j:slf4j-api:$slf4jVersion"
}

// --- Fray harness: opt-in controlled-concurrency tests (not part of the default build) ---
// Enable with -Pfray.enabled=true; without the property this block is inert and the build is
// exactly as before. Fray's artifacts require JVM 11+ while this module compiles tests with
// --release 8, so Fray tests live in a dedicated source set compiled at release 21 and the
// plugin (applied only in this block) is pointed at a dedicated task for that source set.
if (project.hasProperty("fray.enabled") &&
    JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_11)) {
  apply plugin: "org.pastalab.fray.gradle"

  sourceSets {
    frayTest {
      java.srcDir 'src/frayTest/java'
      compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testCompileClasspath
      runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
  }

  dependencies {
    frayTestImplementation "org.pastalab.fray:fray-junit:0.9.2"
    frayTestImplementation "org.pastalab.fray:fray-core:0.9.2"
    frayTestImplementation "org.pastalab.fray:fray-runtime:0.9.2"
    frayTestImplementation "org.pastalab.fray.instrumentation:fray-instrumentation-agent:0.9.2"
    frayTestImplementation "org.pastalab.fray:fray-jvmti-linux-x8664:0.9.2"
  }

  configurations {
    frayTestCompileClasspath {
      attributes {
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
      }
    }
    frayTestRuntimeClasspath {
      attributes {
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
      }
    }
  }

  tasks.register('frayCheck', Test) {
    description = 'Runs Fray controlled-concurrency tests.'
    group = 'verification'
    testClassesDirs = sourceSets.frayTest.output.classesDirs
    classpath = sourceSets.frayTest.runtimeClasspath
    useJUnitPlatform()
  }

  fray {
    testTask = "frayCheck"
  }

  afterEvaluate {
    tasks.named('compileFrayTestJava') {
      options.release = 21
    }
    // The Fray plugin also injects its artifacts into the standard test configurations.
    // They cannot resolve against this module's JVM 8 test classpath, so keep them only
    // in the frayTest configurations above.
    configurations.testImplementation.dependencies.removeAll {
      it.group != null && it.group.startsWith('org.pastalab.fray')
    }
    configurations.testCompileOnly.dependencies.removeAll {
      it.group != null && it.group.startsWith('org.pastalab.fray')
    }
  }
}
